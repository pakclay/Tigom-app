<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tigom — money tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B46C9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tigom">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{if(localStorage.getItem('tigom:lock'))document.documentElement.classList.add('locked')}catch(e){}</script>
<script>(function(){var t='light';try{if(localStorage.getItem('barya:theme')==='dark')t='dark'}catch(e){}document.documentElement.setAttribute('data-theme',t)})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F1F4F9; --sunk:#E2E8F0; --ink:#162033; --muted:#5B6678; --line:#C9D2E0;
  --cobalt:#2B46C9; --cobalt-ink:#FFFFFF; --inc:#17805A; --exp:#A3285E; --warn:#B26B00;
  --inc-soft:#D6EFE3; --exp-soft:#F6DCE7; --warn-soft:#FBEBCF;
  --radius-lg:22px; --radius:14px; --radius-sm:10px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#18202F; --sunk:#222C3E; --ink:#E8EDF6; --muted:#9AA5B8; --line:#2E3A50;
    --cobalt:#7C93FF; --cobalt-ink:#0F1522; --inc:#4FD19B; --exp:#F07AAE; --warn:#F2B44C;
    --inc-soft:#163A2D; --exp-soft:#3E1D2D; --warn-soft:#3B2C12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#18202F; --sunk:#222C3E; --ink:#E8EDF6; --muted:#9AA5B8; --line:#2E3A50;
  --cobalt:#7C93FF; --cobalt-ink:#0F1522; --inc:#4FD19B; --exp:#F07AAE; --warn:#F2B44C;
  --inc-soft:#163A2D; --exp-soft:#3E1D2D; --warn-soft:#3B2C12; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 190px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.theme-btn{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 12px;font-size:13px;font-weight:600;flex:none}
.theme-btn:hover{background:var(--sunk)}
.brand{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--sunk)}
.month span{font-weight:600;font-size:14px;min-width:96px;text-align:center}
/* hero */
.hero{padding:22px 4px 18px}
.hero .lbl{color:var(--muted);font-size:14px}
.big{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.95;font-size:clamp(52px,15vw,84px);margin:4px 0 14px;word-break:break-all}
.big.neg{color:var(--exp)}
.flows{display:flex;gap:10px}
.flow{flex:1;border-radius:var(--radius);padding:10px 12px}
.flow.fin{background:var(--inc-soft)} .flow.fout{background:var(--exp-soft)}
.flow small{display:block;font-size:13px;color:var(--muted)}
.flow b{font-size:18px;font-variant-numeric:tabular-nums}
.flow.fin b{color:var(--inc)} .flow.fout b{color:var(--exp)}
.panel{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-top:14px}
.panel h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:18px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
.empty{color:var(--muted);font-size:15px;margin:4px 0}
/* chart */
.chart{width:100%;height:110px;display:block}
.chart rect{fill:var(--sunk)} .chart rect.has{fill:var(--exp)} .chart rect.today{fill:var(--cobalt)}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
/* category rows */
.cat{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:7px 0}
.cat .em{font-size:20px;grid-row:span 2}
.cat .nm{font-weight:600;font-size:15px}
.cat .amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.bar{grid-column:2/4;height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--exp);border-radius:99px}
.bar i.over{background:var(--warn)}
.cat .sub{grid-column:2/4;font-size:13px;color:var(--muted);margin-top:-2px}
/* tx list */
.day{font-size:13px;color:var(--muted);margin:14px 0 4px;font-weight:600}
.day:first-child{margin-top:0}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:9px 6px;border-radius:var(--radius-sm)}
.tx:hover{background:var(--sunk)}
.tx .ic{width:38px;height:38px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:19px;flex:none}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{color:var(--muted);font-size:13px}
.tx .a{font-variant-numeric:tabular-nums;font-weight:700}
.tx .a{flex:none;white-space:nowrap}
.tx .a.pos{color:var(--inc)} .tx .a.neg{color:var(--ink)}
/* quick add */
.dock{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--line);z-index:5}
.dock-in{max-width:560px;margin:0 auto;padding:10px 12px 0}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:999px;padding:5px 5px 5px 16px;border:1.5px solid var(--line)}
.quick:focus-within{border-color:var(--cobalt)}
.quick input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:16px;padding:8px 0}
.quick input::placeholder{color:var(--muted)}
.btn-round{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;font-size:20px;flex:none}
.btn-go{background:var(--cobalt);color:var(--cobalt-ink);font-weight:700}
.btn-go[disabled]{opacity:.5}
.btn-plus{background:var(--sunk);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);padding:5px 16px 0;min-height:22px}
nav.tabs{display:flex;justify-content:space-around;padding:4px 0 6px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:12px;font-weight:600}
nav.tabs button .e{font-size:19px;filter:grayscale(1);opacity:.7}
nav.tabs button[aria-current="page"]{color:var(--cobalt)}
nav.tabs button[aria-current="page"] .e{filter:none;opacity:1}
/* forms & sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;width:100%;max-width:560px;margin:auto auto 0;max-height:92vh}
dialog::backdrop{background:rgba(10,15,30,.45)}
.sheet{padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0 0 14px;font-size:20px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.seg button[aria-pressed="true"].e{color:var(--exp)} .seg button[aria-pressed="true"].i{color:var(--inc)}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.in:focus{outline:none;border-color:var(--cobalt)}
.amount-in{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:32px;font-weight:700;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt);color:var(--cobalt-ink)}
.row{display:flex;gap:10px} .row>*{flex:1}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;flex:1}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink)}
.btn.ghost{background:var(--sunk)}
.btn.danger{background:var(--exp-soft);color:var(--exp);flex:0 0 auto}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px;flex:0 0 auto}
/* budgets */
.bud{display:grid;grid-template-columns:28px 1fr 112px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .em{font-size:20px;grid-row:span 2}
.bud input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums}
.bud .bar{grid-column:2/4}
.total-bud{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.total-bud b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:28px}
/* bills */
.bill{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bill:last-child{border-bottom:0}
.bill .t{flex:1;min-width:0}
.bill .t b{display:block;font-weight:600}
.bill .t small{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:4px}
.tag.paid{background:var(--inc-soft);color:var(--inc)} .tag.late{background:var(--exp-soft);color:var(--exp)} .tag.soon{background:var(--warn-soft);color:var(--warn)}
.edit-link{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
/* ask */
.asks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.answer{white-space:pre-wrap;font-size:15.5px;line-height:1.6;min-height:24px}
.answer.dim{color:var(--muted)}
textarea.in{resize:vertical;min-height:70px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:20;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline}
.sync{font-size:12px;color:var(--muted)}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.ptabs{display:flex;gap:8px;margin:12px 0 2px}
.ptabs button{border:0;border-radius:14px;padding:10px 16px;font-weight:700;font-size:15px;background:var(--surface);color:var(--muted)}
.ptabs button[aria-selected="true"]{background:var(--cobalt);color:var(--cobalt-ink)}
.gctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.pills{display:flex;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.pill[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch input:checked{background:var(--cobalt)}
.switch input:checked::after{left:21px}
.goal{padding:14px 0;border-bottom:1px solid var(--line)}
.goal:first-child{padding-top:2px}
.gtop{display:flex;align-items:center;gap:12px}
.gem{width:44px;height:44px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-size:22px;flex:none}
.gtop .t{flex:1;min-width:0}
.gtop .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop .t small{color:var(--muted);font-size:13px}
.gpct{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:20px}
.goal .bar{height:10px;margin-top:12px}
.goal .bar i{background:var(--cobalt)}
.goal .bar i.done{background:var(--inc)}
.gnums{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.gact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add-goal{width:100%;margin-top:14px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tool-top{display:flex;align-items:center;gap:8px;margin-top:12px}
.back{border:0;background:var(--surface);color:var(--ink);width:42px;height:42px;border-radius:14px;font-size:24px;flex:none;line-height:1}
.tool-top .ptabs{margin:0;flex:1;overflow-x:auto;scrollbar-width:none}
.tool-top .ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;white-space:nowrap}
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:20px;padding:16px;margin-top:12px;color:var(--ink)}
.tool:hover{background:var(--sunk)}
.ticon{width:54px;height:54px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:26px;flex:none}
.tool:hover .ticon{background:var(--surface)}
.tool .t{flex:1;min-width:0}
.tool .t b{display:block;font-size:17px;font-weight:700}
.tool .t small{display:block;color:var(--muted);font-size:14px;line-height:1.4}
.tool .t em{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--cobalt);margin-top:4px}
.chev{font-size:26px;color:var(--muted)}
.chcard .bar{height:10px;margin-top:12px}
.chcard .bar i{background:var(--cobalt)}
.chcard .bar i.done{background:var(--inc)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.step{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:12.5px;font-weight:700;display:grid;place-items:center;padding:0}
.step[aria-pressed="true"],.step.free{background:var(--inc);border-color:var(--inc);color:var(--bg)}
.step.spent{background:var(--exp-soft);border-color:transparent;color:var(--exp)}
.step.future{opacity:.45}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:8px;color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.opt b{display:block;font-weight:700}
.opt small{color:var(--muted);font-size:13.5px}
html.locked .wrap,html.locked .dock{visibility:hidden}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#lock[hidden]{display:none}
.lock-in{width:100%;max-width:320px;text-align:center}
.lock-logo{font-size:44px;line-height:1}
#lockMsg{font-weight:600;font-size:17px;margin:14px 0 18px}
.dots{display:flex;justify-content:center;gap:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:background .15s}
.dots i.on{background:var(--cobalt);border-color:var(--cobalt)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#lockErr{color:var(--exp);font-size:14px;min-height:42px;margin:12px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:26px;font-weight:600;justify-self:center}
.pad button:active{background:var(--sunk)}
.pad button.txt{background:none;font-size:15px}
.pad button:disabled{visibility:hidden}
.donut{display:block;width:100%;max-width:300px;margin:4px auto 6px}
.crow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}
.cbody{flex:1;min-width:0}
.ctop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ctop b{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctop span{font-weight:700;font-variant-numeric:tabular-nums}
.cbar{display:flex;align-items:center;gap:10px;margin-top:7px}
.ctrack{flex:1;height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.ctrack i{display:block;height:100%;background:var(--cobalt);border-radius:99px}
.ctrack i.over{background:var(--warn)}
.cpct{font-size:12.5px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.csub{font-size:13px;color:var(--muted);margin-top:4px}
.cbody .subs{margin:6px 0 0}
.wstrip{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 0;padding:6px 16px 4px;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
.wcard{flex:none;min-width:128px;text-align:left;border:1.5px solid transparent;background:var(--surface);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.wcard span{font-size:13px;color:var(--muted);white-space:nowrap}
.wcard b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wcard b.neg{color:var(--exp)}
.wcard[aria-pressed="true"]{border-color:var(--cobalt)}
.wcard.add{min-width:100px;border:1.5px dashed var(--line);background:none}
.wcard.add b{font-size:14px;color:var(--cobalt)}
.subs{margin:2px 0 6px 38px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);padding:3px 0;font-variant-numeric:tabular-nums}
.srow.l2{padding-left:16px;font-size:13px}
.srow.l2 span:first-child::before{content:"↳ "}
@media (prefers-reduced-motion:no-preference){
  .big{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Tigom</div>
    <div class="month" id="monthNav">
      <button id="prevM" aria-label="Previous month">‹</button>
      <span id="monthLbl"></span>
      <button id="nextM" aria-label="Next month">›</button>
    </div>
    <button class="theme-btn" id="themeBtn"></button>
  </header>
  <main id="view"></main>
</div>

<div class="dock">
  <div class="dock-in">
    <form class="quick" id="quickForm" autocomplete="off">
      <input id="quickIn" aria-label="Quick add" placeholder="Try “jollibee 189, grab 240”">
      <button type="button" class="btn-round btn-plus" id="openAdd" aria-label="Add with form">＋</button>
      <button type="submit" class="btn-round btn-go" id="quickGo" aria-label="Add">↑</button>
    </form>

<script>
(() => {
// ---------- categories ----------
const EXP_BASE = [
  {k:'food',n:'Food',e:'🍜',w:['food','lunch','dinner','breakfast','merienda','coffee','starbucks','jollibee','mcdo','mcdonald','kfc','chowking','grocery','groceries','palengke','snack','milk tea','milktea','resto','restaurant','pizza','ulam','bigas','rice','foodpanda']},
  {k:'transport',n:'Transport',e:'🚕',w:['grab','taxi','jeep','jeepney','tricycle','bus','mrt','lrt','gas','gasoline','fuel','parking','toll','angkas','joyride','fare','pamasahe','uber','move it']},
  {k:'bills',n:'Bills',e:'💡',w:['meralco','electric','electricity','water','maynilad','manila water','rent','upa','bill','bills','insurance','loan','amortization']},
  {k:'load',n:'Load & internet',e:'📶',w:['load','globe','smart','pldt','converge','wifi','internet','data','sky','dito','netflix','spotify','youtube premium','subscription']},
  {k:'shopping',n:'Shopping',e:'🛍️',w:['shopee','lazada','clothes','shoes','mall','uniqlo','shopping','gadget','sm ']},
  {k:'health',n:'Health',e:'💊',w:['medicine','gamot','doctor','hospital','clinic','mercury','watsons','checkup','dentist','vitamins','gym','therapy']},
  {k:'fun',n:'Fun',e:'🎬',w:['movie','cinema','concert','games','game','bar','beer','drinks','inuman','travel','trip','hotel','staycation']},
  {k:'family',n:'Family',e:'👨‍👩‍👧',w:['family','padala','allowance','baon','tuition','school','kids','nanay','tatay','mama','papa']},
  {k:'debt',n:'Debt payments',e:'💳',w:['loan payment','credit card','cc payment','installment','hulog']},
  {k:'other',n:'Other',e:'📦',w:[]}
];
const INC_BASE = [
  {k:'salary',n:'Salary',e:'💼',w:['salary','sahod','sweldo','payroll','paycheck','13th month','bonus']},
  {k:'business',n:'Business',e:'🏪',w:['sale','sales','benta','business','store','tindahan','profit','client','customer']},
  {k:'freelance',n:'Freelance',e:'💻',w:['freelance','project','commission','upwork','gig','raket','sideline']},
  {k:'gift',n:'Gift',e:'🎁',w:['gift','regalo','padala from','received from','pamasko','ampao']},
  {k:'other_in',n:'Other income',e:'➕',w:['refund','cashback','interest','income','earned']}
];
let EXP = EXP_BASE, INC = INC_BASE, ALL = [...EXP, ...INC];
function rebuildCats(){
  const mine = t => (S.cats || []).filter(c => c.t === t).map(c => ({k:c.k, n:c.n, e:c.e, w:[' ' + c.n.toLowerCase()]}));
  EXP = [...mine('expense'), ...EXP_BASE];
  INC = [...mine('income'), ...INC_BASE];
  ALL = [...EXP, ...INC];
}
// ---------- subcategories (level 1 parent = category key, level 2 parent = subcategory key) ----------
const subsOf = p => (S.subs || []).filter(s => s.p === p);
const subById = k => k ? (S.subs || []).find(s => s.k === k) : undefined;
const rootType = k => INC.some(c => c.k === k) ? 'income' : 'expense';
const catPath = t => [catOf(t.cat).n, subById(t.sub1)?.n, t.sub1 ? subById(t.sub2)?.n : ''].filter(Boolean).join(' › ');
function matchSub(text){
  const s = ' ' + String(text || '').toLowerCase() + ' ';
  const subs = S.subs || [];
  const hit = x => s.includes(' ' + x.n.toLowerCase());
  for (const x of subs) { const p = subs.find(y => y.k === x.p); if (p && ALL.some(c => c.k === p.p) && hit(x)) return {cat:p.p, sub1:p.k, sub2:x.k}; }
  for (const x of subs) { if (ALL.some(c => c.k === x.p) && hit(x)) return {cat:x.p, sub1:x.k}; }
  return null;
}
function withSub(t, text){
  const m = matchSub(text); if (!m) return t;
  const r = {...t, cat:m.cat, type:rootType(m.cat), sub1:m.sub1};
  if (m.sub2) r.sub2 = m.sub2; else delete r.sub2;
  return r;
}
// ---------- wallets ----------
function ensureWallets(){ if (!Array.isArray(S.wallets) || !S.wallets.length) S.wallets = [{k:'w_cash', n:'Cash', e:'💵', start:0}]; }
function defaultWallet(){ return walletFilter && S.wallets.some(w => w.k === walletFilter) ? walletFilter : S.wallets[0].k; }
function walletOf(k){ return S.wallets.find(w => w.k === k) || S.wallets[0]; }
function txWallet(t){ return S.wallets.some(w => w.k === t.w) ? t.w : S.wallets[0].k; }
function balances(){
  const b = {}; for (const w of S.wallets) b[w.k] = Number(w.start) || 0;
  for (const ym in S.tx) for (const t of S.tx[ym]) {
    const w = txWallet(t);
    if (t.type === 'income') b[w] += t.amount;
    else if (t.type === 'expense') b[w] -= t.amount;
    else if (t.type === 'transfer') { b[w] -= t.amount; if (b[t.to] !== undefined) b[t.to] += t.amount; }
    else if (t.type === 'saving') b[w] += t.out ? t.amount : -t.amount;
    else if (t.type === 'loan') b[w] += t.dir === 'in' ? t.amount : -t.amount;
  }
  return b;
}
function findWalletIn(text){
  const s = ' ' + String(text || '').toLowerCase() + ' ';
  return [...S.wallets].sort((a, b) => b.n.length - a.n.length).find(w => new RegExp('[^a-z0-9]' + w.n.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[^a-z0-9]').test(s));
}
function matchWallet(text){ const w = findWalletIn(text); return w ? w.k : defaultWallet(); }
function stripWallet(note){
  const w = findWalletIn(note); if (!w) return note;
  const out = note.replace(new RegExp('\\b(?:via|from|using|thru|through|sa)?\\s*' + w.n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i'), ' ').replace(/\s+/g, ' ').trim();
  return out ? out[0].toUpperCase() + out.slice(1) : '';
}
function walletByName(n){ const w = S.wallets.find(x => n && x.n.toLowerCase() === String(n).toLowerCase()); return w ? w.k : defaultWallet(); }
function txSub(t){
  if (t.type === 'loan') {
    const l = loanOf(t.loan), p = l ? l.person : 'someone', lent = l ? l.kind === 'lent' : t.dir === 'out';
    const first = lent ? t.dir === 'out' : t.dir === 'in';
    return (first ? (lent ? 'Lent to ' : 'Borrowed from ') : (lent ? 'Paid back by ' : 'Paid back to ')) + p + (S.wallets.length > 1 ? ' · ' + walletOf(txWallet(t)).n : '');
  }
  if (t.type === 'saving') return `${t.out ? 'Taken from' : 'Saved to'} ${goalOf(t.goal)?.n || 'savings'}${S.wallets.length > 1 ? ' · ' + walletOf(txWallet(t)).n : ''}`;
  if (t.type === 'transfer') return `${walletOf(t.w).n} → ${walletOf(t.to).n}`;
  return catPath(t) + (S.wallets.length > 1 ? ' · ' + walletOf(txWallet(t)).n : '');
}
function txSign(t){
  if (t.type === 'income') return ['+', 'pos'];
  if (t.type === 'expense') return ['−', 'neg'];
  if (t.type === 'saving') return t.out ? ['+', 'pos'] : ['−', 'neg'];
  if (t.type === 'loan') return t.dir === 'in' ? ['+', 'pos'] : ['−', 'neg'];
  if (walletFilter && walletFilter === t.to) return ['+', 'pos'];
  if (walletFilter && walletFilter === txWallet(t)) return ['−', 'neg'];
  return ['', 'neg'];
}
function walletStrip(){
  const b = balances(); const total = Object.values(b).reduce((a, x) => a + x, 0);
  const card = (k, e, n, v) => `<button class="wcard" data-wsel="${k}" aria-pressed="${walletFilter === k}"><span>${e} ${esc(n)}</span><b class="${v < 0 ? 'neg' : ''}">${money(v)}</b></button>`;
  return `<div class="wstrip" role="group" aria-label="Wallets">${card('', '👛', 'All wallets', total)}${S.wallets.map(w => card(w.k, w.e, w.n, b[w.k])).join('')}<button class="wcard add" id="addWallet"><span>＋</span><b>Add wallet</b></button></div>`;
}
function walletChips(attr, sel){ return `<div class="chips">${S.wallets.map(w => `<button class="chip" ${attr}="${w.k}" aria-pressed="${w.k === sel}">${w.e} ${esc(w.n)}</button>`).join('')}</div>`; }
function walletPicker(d){
  if (d.type === 'transfer') {
    if (S.wallets.length < 2) return `<p class="empty" style="margin-top:12px">Add a second wallet (tap “＋ Add wallet” on Home) to move money between wallets.</p>`;
    return `<label class="f">From</label>${walletChips('data-wf', d.w)}<label class="f">To</label>${walletChips('data-wt', d.to)}`;
  }
  return `<label class="f">Wallet</label>${walletChips('data-w', d.w)}`;
}
function addChip(level, d){
  return d.adding === level
    ? `<span style="display:flex;gap:6px;width:100%"><input class="in" id="newSub" maxlength="24" placeholder="Name" style="padding:7px 10px;flex:1"><button class="btn small primary" data-addsub>Add</button></span>`
    : `<button class="chip" data-plus="${level}">＋ Add</button>`;
}
function subPicker(d){
  const s1 = subsOf(d.cat);
  let h = `<label class="f">Subcategory 1</label><div class="chips"><button class="chip" data-s1="" aria-pressed="${!d.sub1}">None</button>${s1.map(s => `<button class="chip" data-s1="${s.k}" aria-pressed="${s.k === d.sub1}">${esc(s.n)}</button>`).join('')}${addChip(1, d)}</div>`;
  if (d.sub1) {
    const s2 = subsOf(d.sub1);
    h += `<label class="f">Subcategory 2</label><div class="chips"><button class="chip" data-s2="" aria-pressed="${!d.sub2}">None</button>${s2.map(s => `<button class="chip" data-s2="${s.k}" aria-pressed="${s.k === d.sub2}">${esc(s.n)}</button>`).join('')}${addChip(2, d)}</div>`;
  }
  return h;
}
function subRows(k, by){
  const s1 = subsOf(k).filter(s => by[s.k]);
  if (!s1.length) return '';
  return '<div class="subs">' + s1.map(s => `<div class="srow"><span>${esc(s.n)}</span><span>${money(by[s.k])}</span></div>` + subsOf(s.k).filter(x => by[x.k]).map(x => `<div class="srow l2"><span>${esc(x.n)}</span><span>${money(by[x.k])}</span></div>`).join('')).join('') + '</div>';
}
const catOf = k => ALL.find(c => c.k === k) || EXP[EXP.length-1];
const INCOME_WORDS = ['salary','sahod','sweldo','income','bonus','received','got paid','paid me','sale','sales','benta','earned','refund','cashback','freelance','commission','raket','sideline','gift from','pamasko','13th month','profit','interest'];

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = date => date.slice(0,7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const money = (n) => (n < 0 ? '−' : '') + S.settings.cur + nf.format(Math.abs(Math.round(n*100)/100));
const monthName = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'}); };
const shiftYm = (ym, d) => { const [y,m] = ym.split('-').map(Number); const t = new Date(y, m-1+d, 1); return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; };
const daysIn = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y,m,0).getDate(); };
const dayLabel = date => {
  if (date === today()) return 'Today';
  const y = new Date(); y.setDate(y.getDate()-1);
  if (date === `${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`) return 'Yesterday';
  const [Y,M,D] = date.split('-').map(Number);
  return new Date(Y,M-1,D).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
};

// ---------- state & storage ----------
const LS = 'barya:v1';
let S = { settings:{cur:'₱'}, budgets:{}, bills:[], tx:{}, cats:[], subs:[], wallets:[], goals:[], debts:[], loans:[], challenges:[] };
try { const c = JSON.parse(localStorage.getItem(LS) || 'null'); if (c && c.tx) S = Object.assign(S, c); } catch(e) {}
rebuildCats(); ensureWallets();
let view = 'home', curYm = ymOf(today());
let walletFilter = '';
let col = null; // db collection when signed in
let sampleFn = null, downloadsNs = null;
let syncState = 'This device';

const monthTx = ym => (S.tx[ym] || []);
function cacheLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} }
async function persist(ids){
  cacheLocal();
  if (!col) return;
  for (const id of ids) {
    try {
      if (id === 'meta') await col.doc('meta').set({settings:S.settings, budgets:S.budgets, bills:S.bills, cats:S.cats || [], subs:S.subs || [], wallets:S.wallets || [], goals:S.goals || [], debts:S.debts || [], loans:S.loans || [], challenges:S.challenges || []});
      else await col.doc('m-'+id).set({tx: monthTx(id)});
    } catch(e) { syncState = 'Saved on this device only'; }
  }
}

async function initCloud(){
  try {
    const cl = window.claude; if (!cl || !cl.use) return;
    cl.use('sample').then(s => { sampleFn = s; }).catch(()=>{});
    cl.use('downloads').then(d => { downloadsNs = d; }).catch(()=>{});
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const c = db.collection('data/users/' + id);
    const snap = await c.get();
    col = c;
    if (snap.docs.length === 0) {
      // first time signed in: move anything recorded on this device up
      const ids = ['meta', ...Object.keys(S.tx)];
      await persist(ids);
    } else {
      const next = { settings:{cur:'₱'}, budgets:{}, bills:[], tx:{} };
      for (const d of snap.docs) {
        if (!d.exists) continue;
        const v = JSON.parse(JSON.stringify(d.data()));
        if (d.id === 'meta') { next.settings = v.settings || next.settings; next.budgets = v.budgets || {}; next.bills = v.bills || []; next.cats = v.cats || []; next.subs = v.subs || []; next.wallets = v.wallets || []; next.goals = v.goals || []; next.debts = v.debts || []; next.loans = v.loans || []; next.challenges = v.challenges || []; }
        else if (d.id.startsWith('m-')) next.tx[d.id.slice(2)] = v.tx || [];
      }
      S = next; rebuildCats(); ensureWallets(); cacheLocal();
    }
    syncState = 'Synced to your Claude account';
    render();
  } catch(e) { /* stay local */ }
}

// ---------- mutations ----------
let lastAdded = [];
function addTx(list){
  const touched = new Set();
  for (const t of list) {
    const ym = ymOf(t.date);
    (S.tx[ym] = S.tx[ym] || []).push(t);
    touched.add(ym);
  }
  lastAdded = list.map(t => t.id);
  persist([...touched]);
}
function removeTx(id){
  for (const ym in S.tx) {
    const i = S.tx[ym].findIndex(t => t.id === id);
    if (i > -1) { S.tx[ym].splice(i,1); persist([ym]); return; }
  }
}
function updateTx(t){
  removeTx(t.id); const ym = ymOf(t.date);
  (S.tx[ym] = S.tx[ym] || []).push(t); persist([ym]);
}

// ---------- quick-add parsing ----------
function guessCat(text, type){
  const s = ' ' + text.toLowerCase() + ' ';
  const pool = type === 'income' ? INC : EXP;
  for (const c of pool) if (c.w.some(w => s.includes(w))) return c.k;
  return type === 'income' ? 'other_in' : 'other';
}
function localParse(input){
  const out = [];
  for (const raw of input.split(/,(?=\s*\D)|\n|;|\s+and\s+/i)) {
    const chunk = raw.trim(); if (!chunk) continue;
    const m = chunk.match(/(?:₱|\bphp|\bp(?=\d))?\s*(\d[\d,]*(?:\.\d+)?)\s*(k)?\b/i);
    if (!m) continue;
    let amt = parseFloat(m[1].replace(/,/g,'')); if (m[2]) amt *= 1000;
    if (!(amt > 0)) continue;
    let note = chunk.replace(m[0],' ').replace(/\s+/g,' ').replace(/^(?:(?:for|sa|on)\s+|[-:]\s*)/i,'').trim();
    const low = chunk.toLowerCase();
    const type = INCOME_WORDS.some(w => low.includes(w)) || /^\+/.test(chunk) ? 'income' : 'expense';
    let date = today();
    if (/\b(yesterday|kahapon)\b/i.test(chunk)) { const d = new Date(); d.setDate(d.getDate()-1); date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; note = note.replace(/\b(yesterday|kahapon)\b/i,'').trim(); }
    note = note.replace(/\s+/g,' ').trim(); note = note ? note[0].toUpperCase() + note.slice(1) : catOf(guessCat(chunk,type)).n;
    out.push(withSub({id:uid(), type, amount:amt, cat:guessCat(chunk,type), note: stripWallet(note) || note, date, w: matchWallet(chunk)}, chunk));
  }
  return out;
}
async function aiParse(input){
  if (!sampleFn) return null;
  const prompt = `You turn short notes about money into transactions for a personal expense tracker used in the Philippines (amounts in ${S.settings.cur}). Notes may mix English and Tagalog/Taglish.
Today is ${today()}.
Expense categories (key: meaning): ${EXP.map(c=>c.k+': '+c.n).join('; ')}.
Income categories: ${INC.map(c=>c.k+': '+c.n).join('; ')}.
Reply with only a JSON array. Each item: {"type":"expense"|"income","amount":number,"cat":one of the keys above matching the type,"note":short title-case description (2-4 words),"date":"YYYY-MM-DD","wallet":the wallet named for that item, one of [${S.wallets.map(w=>w.n).join(', ')}], else null}. "5k" means 5000. Resolve words like yesterday/kahapon or a weekday into a date on or before today. Skip anything without an amount. Return [] if nothing applies.

Notes: ${input}`;
  const arr = await sampleFn.json(prompt, {modelTier:'quick'});
  if (!Array.isArray(arr)) return null;
  const keys = new Set(ALL.map(c=>c.k));
  return arr.filter(x => x && Number(x.amount) > 0).map(x => {
    const type = x.type === 'income' ? 'income' : 'expense';
    let cat = keys.has(x.cat) ? x.cat : (type==='income'?'other_in':'other');
    if (type === 'income' && !INC.some(c=>c.k===cat)) cat = 'other_in';
    if (type === 'expense' && !EXP.some(c=>c.k===cat)) cat = 'other';
    const date = /^\d{4}-\d{2}-\d{2}$/.test(x.date||'') && x.date <= today() ? x.date : today();
    return {id:uid(), type, amount:Math.round(Number(x.amount)*100)/100, cat, note:String(x.note||catOf(cat).n).slice(0,60), date, w: walletByName(x.wallet)};
  });
}

$('#quickForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('#quickIn').value.trim(); if (!v) return;
  const go = $('#quickGo'); go.disabled = true;
  let items = null;
  if (sampleFn) {
    $('#hint').textContent = 'Reading that…';
    try { items = await aiParse(v); } catch(err) { items = null; }
  }
  if (!items || !items.length) items = localParse(v);
  items = items.map(t => t.sub1 ? t : withSub(t, t.note));
  go.disabled = false;
  if (!items.length) { $('#hint').textContent = 'Add an amount, like “lunch 150” or “sahod 25k”.'; return; }
  addTx(items);
  $('#quickIn').value = '';
  $('#hint').textContent = 'Type what you spent or earned. Add several at once with commas.';
  curYm = ymOf(items[items.length-1].date);
  render();
  const total = items.reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0);
  toast(items.length === 1 ? `Added ${items[0].note} · ${money(items[0].amount)}` : `Added ${items.length} items · net ${money(total)}`, () => { lastAdded.forEach(removeTx); render(); });
});

// ---------- toast ----------
let toastT;
function toast(msg, undo){
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status');
  el.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button>Undo</button>' : '');
  if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
  document.body.append(el); toastT = setTimeout(()=>el.remove(), 5000);
}

// ---------- totals ----------
function totals(ym, wf=''){
  let inc=0, exp=0; const byCat={}; const byIn={}; const bySub={}; const byDay=new Array(daysIn(ym)).fill(0);
  for (const t of monthTx(ym)) {
    if (t.type === 'transfer' || t.type === 'saving' || t.type === 'loan') continue;
    if (wf && txWallet(t) !== wf) continue;
    if (t.type==='income') { inc+=t.amount; byIn[t.cat]=(byIn[t.cat]||0)+t.amount; if (t.sub1) bySub[t.sub1]=(bySub[t.sub1]||0)+t.amount; if (t.sub1 && t.sub2) bySub[t.sub2]=(bySub[t.sub2]||0)+t.amount; }
    else { exp+=t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount; byDay[Number(t.date.slice(8))-1]+=t.amount; if (t.sub1) bySub[t.sub1]=(bySub[t.sub1]||0)+t.amount; if (t.sub1 && t.sub2) bySub[t.sub2]=(bySub[t.sub2]||0)+t.amount; }
  }
  return {inc, exp, net:inc-exp, byCat, byIn, byDay, bySub};
}

let homeKind = 'expense';
const SLICE = ['#74B9E8','#EFB8EC','#BDEBC6','#FAD7B0','#F7B5BA','#C3BEF3','#AEE0DA','#F2DC86','#D7CFC2','#A9C7EE'];
function breakdownPanel(T){
  const isExp = homeKind === 'expense';
  const map = isExp ? T.byCat : T.byIn, total = isExp ? T.exp : T.inc;

  if (!cats.length || !(total > 0)) return h + `<p class="empty" style="text-align:center;margin:18px 0 8px">No ${isExp ? 'expenses' : 'income'} this month${walletFilter ? ' in this wallet' : ''}.</p></section>`;
  const cx = 150, cy = 150, R = 112, r = 52;
  const pt = (rad, a) => (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2);
  let a0 = -Math.PI / 2, paths = '', badges = '';
  cats.forEach(([k, v], i) => {
    const frac = v / total, a1 = a0 + frac * 2 * Math.PI, col = SLICE[i % SLICE.length], c = catOf(k);
    if (frac >= 0.9999) paths += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${col}" stroke-width="${R - r}"><title>${esc(c.n)}: ${money(v)}</title></circle>`;
    else {
      const large = a1 - a0 > Math.PI ? 1 : 0;
      paths += `<path d="M ${pt(R, a0)} A ${R} ${R} 0 ${large} 1 ${pt(R, a1)} L ${pt(r, a1)} A ${r} ${r} 0 ${large} 0 ${pt(r, a0)} Z" fill="${col}" stroke="var(--surface)" stroke-width="2"><title>${esc(c.n)}: ${money(v)}</title></path>`;
    }
    if (frac >= 0.06) {
      const am = (a0 + a1) / 2, bx = (cx + R * Math.cos(am)).toFixed(1), by = (cy + R * Math.sin(am)).toFixed(1);
      badges += `<circle cx="${bx}" cy="${by}" r="19" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="${bx}" y="${by}" text-anchor="middle" dominant-baseline="central" font-size="18">${c.e}</text>`;
    }

  });
  const tot = money(total);
  h += `<svg class="donut" viewBox="0 0 300 300" role="img" aria-label="${isExp ? 'Spending' : 'Income'} by category">${paths}${badges}
    <text x="150" y="140" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Figtree,system-ui,sans-serif">${isExp ? 'Spent' : 'Earned'}</text>

  h += cats.map(([k, v], i) => {
    const c = catOf(k), raw = v / total * 100, pct = raw > 0 && raw < 1 ? '<1' : Math.round(raw);
    const lim = isExp ? S.budgets[k] : 0;
    return `<div class="crow"><span class="cic" style="background:${SLICE[i % SLICE.length]}66">${c.e}</span><div class="cbody">
      <div class="ctop"><b>${esc(c.n)}</b><span>${money(v)}</span></div>
      <div class="cbar"><div class="ctrack"><i class="${lim && v > lim ? 'over' : ''}" style="width:${Math.max(raw, 1.5)}%"></i></div><span class="cpct">${pct}%</span></div>

      ${subRows(k, T.bySub)}</div></div>`;
  }).join('');
  return h + '</section>';
}

const GEMOJI = ['🛡️','✈️','🏠','🎓','💍','📱','🚗','🎁','🐷','🏖️','💻','👶'];
function goalOf(k){ return (S.goals || []).find(g => g.k === k); }
function isoDay(x){ return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; }
function periodStart(g){
  const d = new Date();
  if (g.period === 'weekly') { d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDay(d); }
  return ymOf(today()) + '-01';
}
function goalSaved(k, since){
  let s = 0;
  for (const ym in S.tx) for (const t of S.tx[ym]) if (t.type === 'saving' && t.goal === k && (!since || t.date >= since)) s += t.out ? -t.amount : t.amount;
  return Math.round(s * 100) / 100;
}
function goalProgress(g){
  const total = goalSaved(g.k);
  const saved = g.kind === 'recurring' ? goalSaved(g.k, periodStart(g)) : total;
  const pct = g.target > 0 ? Math.max(0, Math.min(100, Math.floor(saved / g.target * 100))) : 0;
  return {saved, total, pct, done: saved >= g.target, left: Math.max(0, Math.round((g.target - saved) * 100) / 100)};
}
function dueLabel(s){ const [Y, M, D] = s.split('-').map(Number); return new Date(Y, M - 1, D).toLocaleDateString('en-PH', {month:'short', day:'numeric', year:'numeric'}); }
function goalSubline(g, p){
  if (g.kind === 'recurring') return `${g.period === 'weekly' ? 'This week' : 'This month'} · ${money(p.total)} saved in total`;
  if (!g.due) return 'No target date';
  if (p.done) return `Target date ${dueLabel(g.due)}`;
  if (g.due < today()) return `Target date ${dueLabel(g.due)} has passed`;
  const now = new Date(), [Y, M] = g.due.split('-').map(Number);
  const months = Math.max(1, (Y - now.getFullYear()) * 12 + (M - 1) - now.getMonth());
  return `By ${dueLabel(g.due)} · about ${money(Math.ceil(p.left / months))}/month`;
}

// ---------- lend / borrow ----------
function loanOf(k){ return (S.loans || []).find(l => l.k === k); }
function loanStats(l){
  let given = 0, back = 0;
  for (const t of allTx()) if (t.type === 'loan' && t.loan === l.k) {
    const first = l.kind === 'lent' ? t.dir === 'out' : t.dir === 'in';
    if (first) given += t.amount; else back += t.amount;
  }
  return {given, back, left: Math.max(0, Math.round((given - back) * 100) / 100)};
}
function loanTotals(){
  let owedToYou = 0, youOwe = 0;
  for (const l of S.loans || []) { const s = loanStats(l); if (l.kind === 'lent') owedToYou += s.left; else youOwe += s.left; }
  return {owedToYou, youOwe};
}

// ---------- challenges ----------
function chOf(k){ return (S.challenges || []).find(c => c.k === k); }
function chSteps(ch){ return ch.kind === '52week' ? 52 : (ch.days || 0); }
function chStepAmt(ch, i){ return ch.kind === '52week' ? ch.base * i : ch.base; }
function chTotal(ch){ return ch.kind === '52week' ? ch.base * 1378 : ch.base * ch.days; }
function chDone(ch){ const m = new Map(); for (const t of allTx()) if (t.type === 'saving' && t.goal === ch.goal && t.step) m.set(t.step, t.id); return m; }
function ensureChGoal(ch){ if (!goalOf(ch.goal)) { S.goals = [...(S.goals || []), {k:ch.goal, n:ch.n, e:'🏆', target:chTotal(ch), kind:'oneoff'}]; persist(['meta']); } }
function noSpendDays(ch){
  const spent = new Set(monthTx(ch.ym).filter(t => t.type === 'expense').map(t => t.date));
  const td = today(), out = [];
  for (let i = 1; i <= daysIn(ch.ym); i++) { const ds = `${ch.ym}-${pad(i)}`; out.push({i, ds, state: ds > td ? 'future' : spent.has(ds) ? 'spent' : 'free'}); }
  return out;
}
function renderChallenge(){
  const list = S.challenges || [];
  let html = planTabs() + `<section class="hero" style="padding-bottom:4px"><div class="lbl">Challenges</div><div class="big" style="font-size:clamp(36px,10vw,52px)">${list.length ? list.length + ' active' : 'Build the habit'}</div></section>`;
  if (!list.length) html += `<section class="panel">${emptyBlock('🏆', 'No challenges yet', 'Try the 52-week challenge, a daily ipon challenge, or count your no-spend days this month.')}<button class="btn primary add-goal" id="addCh">＋ Start a challenge</button></section>`;
  for (const ch of list) {
    html += `<section class="panel chcard">`;
    if (ch.kind === 'nospend') {
      const days = noSpendDays(ch), free = days.filter(x => x.state === 'free').length;
      const pct = Math.min(100, Math.floor(free / ch.target * 100));
      html += `<div class="gtop"><span class="gem">🙅</span><div class="t"><b>${esc(ch.n)}</b><small>${free} of ${ch.target} no-spend days</small></div><span class="gpct">${pct}%</span></div>
        <div class="bar"><i class="${pct >= 100 ? 'done' : ''}" style="width:${pct}%"></i></div>
        <p class="empty" style="font-size:13.5px;margin:10px 0 8px">Days with no expenses count automatically. Green = no spending, pink = you spent.</p>
        <div class="cgrid">${days.map(x => `<span class="step ${x.state}" aria-label="Day ${x.i}: ${x.state === 'free' ? 'no spending' : x.state === 'spent' ? 'spent' : 'not yet'}">${x.i}</span>`).join('')}</div>`;
    } else {
      const done = chDone(ch), steps = chSteps(ch), total = chTotal(ch);
      const saved = [...done.keys()].reduce((a, i) => a + chStepAmt(ch, i), 0);
      const pct = Math.min(100, Math.floor(saved / total * 100));
      const unit = ch.kind === '52week' ? 'Week' : 'Day';
      html += `<div class="gtop"><span class="gem">${ch.kind === '52week' ? '📅' : '🪙'}</span><div class="t"><b>${esc(ch.n)}</b><small>${done.size} of ${steps} ${unit.toLowerCase()}s · ${money(saved)} of ${money(total)}</small></div><span class="gpct">${pct}%</span></div>
        <div class="bar"><i class="${pct >= 100 ? 'done' : ''}" style="width:${pct}%"></i></div>
        <p class="empty" style="font-size:13.5px;margin:10px 0 8px">${ch.kind === '52week' ? `Week number × ${money(ch.base)}, so week 10 is ${money(ch.base * 10)}.` : `Save ${money(ch.base)} each day.`} Tap a ${unit.toLowerCase()} once you’ve saved it. It goes into Savings.</p>
        <div class="cgrid">${Array.from({length: steps}, (_, j) => j + 1).map(i => `<button class="step" data-ch="${ch.k}" data-step="${i}" aria-pressed="${done.has(i)}" aria-label="${unit} ${i}, ${money(chStepAmt(ch, i))}" title="${money(chStepAmt(ch, i))}">${i}</button>`).join('')}</div>`;
    }
    html += `<div class="gact" style="margin-top:12px"><button class="btn small ghost" data-chdel="${ch.k}">Delete</button></div></section>`;
  }
  if (list.length) html += `<button class="btn primary add-goal" id="addCh">＋ Start a challenge</button>`;
  $('#view').innerHTML = html;
  bindPlanTabs();
  $('#addCh').onclick = () => openChallengeSheet();
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const ch = chOf(b.dataset.ch), i = Number(b.dataset.step), done = chDone(ch);
    if (done.has(i)) removeTx(done.get(i));
    else {
      ensureChGoal(ch);
      addTx([{id:uid(), type:'saving', amount:chStepAmt(ch, i), goal:ch.goal, step:i, w: S.wallets.some(x => x.k === ch.w) ? ch.w : defaultWallet(), cat:'saving', note:`${ch.n} · ${ch.kind === '52week' ? 'Week' : 'Day'} ${i}`, date:today()}]);
      if (chDone(ch).size === chSteps(ch)) toast(`🏆 You finished ${ch.n}!`);
    }
    render();
  });
  document.querySelectorAll('[data-chdel]').forEach(b => b.onclick = () => {
    const ch = chOf(b.dataset.chdel);
    const saved = ch.goal ? goalSaved(ch.goal) : 0;
    if (!confirm(saved > 0 ? `Delete ${ch.n}? The ${money(saved)} saved goes back to your wallets.` : `Delete ${ch.n}?`)) return;
    const touched = [];
    if (ch.goal) {
      for (const ym in S.tx) { const before = S.tx[ym].length; S.tx[ym] = S.tx[ym].filter(t => !(t.type === 'saving' && t.goal === ch.goal)); if (S.tx[ym].length !== before) touched.push(ym); }
      S.goals = (S.goals || []).filter(g => g.k !== ch.goal);
    }
    S.challenges = S.challenges.filter(c => c.k !== ch.k);
    persist(['meta', ...touched]); render();
  });
}

function billStatus(b){
  const nowYm = ymOf(today());
  if (b.paid && b.paid[curYm]) return {t:'Paid',c:'paid'};
  if (curYm < nowYm) return {t:'Not paid',c:'late'};
  if (curYm > nowYm) return null;
  const d = Number(today().slice(8)), due = Math.min(b.day, daysIn(curYm));
  if (d > due) return {t:'Overdue',c:'late'};
  if (due - d <= 3) return {t: due===d?'Due today':`Due in ${due-d} day${due-d>1?'s':''}`, c:'soon'};
  return null;
}
function renderBills(){
  const bills = [...S.bills].sort((a,b)=>a.day-b.day);
  const unpaid = bills.filter(b=>!(b.paid&&b.paid[curYm])).reduce((a,b)=>a+b.amount,0);
  let html = `<section class="hero"><div class="lbl">Still to pay in ${esc(monthName(curYm))}</div><div class="big" style="font-size:clamp(40px,11vw,60px)">${money(unpaid)}</div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 style="margin:0">Recurring bills</h2><button class="btn primary small" id="addBill">Add bill</button></div>`;
  if (!bills.length) html += `<p class="empty">Add rent, Meralco, internet or subscriptions. Mark them paid each month and they’re logged as expenses automatically.</p>`;
  for (const b of bills) {
    const st = billStatus(b), c = catOf(b.cat), paid = b.paid && b.paid[curYm];
    html += `<div class="bill"><span style="font-size:22px">${c.e}</span><span class="t"><b>${esc(b.name)}${st?`<span class="tag ${st.c}">${st.t}</span>`:''}</b><small>${money(b.amount)} · every ${ordinal(b.day)} · <button class="edit-link" data-edit="${b.id}">Edit</button></small></span><button class="btn small ${paid?'ghost':'primary'}" data-pay="${b.id}">${paid?'Undo':'Mark paid'}</button></div>`;
  }
  html += `</section>`;
  $('#view').innerHTML = html;
  $('#addBill').onclick = () => openBillSheet();
  document.querySelectorAll('[data-edit]').forEach(x => x.onclick = () => openBillSheet(S.bills.find(b=>b.id===x.dataset.edit)));
  document.querySelectorAll('[data-pay]').forEach(x => x.onclick = () => {
    const b = S.bills.find(b=>b.id===x.dataset.pay); b.paid = b.paid || {};
    if (b.paid[curYm]) { removeTx(b.paid[curYm]); delete b.paid[curYm]; }
    else {
      const day = curYm === ymOf(today()) ? today() : `${curYm}-${pad(Math.min(b.day, daysIn(curYm)))}`;
      const t = {id:uid(), type:'expense', amount:b.amount, cat:b.cat, note:b.name, date:day, w: S.wallets.some(x => x.k === b.w) ? b.w : S.wallets[0].k};
      addTx([t]); b.paid[curYm] = t.id;
    }
    persist(['meta']); render();
  });
}

function buildContext(){
  const now = ymOf(today()), prev = shiftYm(now,-1);
  const sum = ym => { const T = totals(ym); return `${monthName(ym)}: income ${T.inc}, expenses ${T.exp}. By category: ${Object.entries(T.byCat).map(([k,v])=>catOf(k).n+' '+v).join(', ') || 'none'}.`; };
  const tx = [...monthTx(prev), ...monthTx(now)].sort((a,b)=>a.date.localeCompare(b.date)).slice(-400).map(t=>`${t.date} ${t.type==='income'?'+':'-'}${t.amount} ${txSub(t)} "${t.note}"`).join('\n');
  const gl = (S.goals || []).map(g => { const p = goalProgress(g); return `${g.n} (${g.kind === 'recurring' ? g.period + ' target ' + g.target + ', saved this period ' + p.saved : 'target ' + g.target + (g.due ? ' by ' + g.due : '')}, saved in total ${p.total})`; }).join('; ') || 'none';
  const dl = (S.debts || []).map(d => `${d.n}${d.lender ? ' to ' + d.lender : ''}: total ${d.total}, paid ${debtPaid(d.k)}, left ${debtLeft(d)}${d.day ? ', due day ' + d.day : ''}${d.minPay ? ', minimum ' + d.minPay : ''}`).join('; ') || 'none';
  const ll = (S.loans || []).map(l => { const s = loanStats(l); return `${l.kind === 'lent' ? 'lent to' : 'borrowed from'} ${l.person}: ${s.given}, paid back ${s.back}, outstanding ${s.left}${l.due ? ', due ' + l.due : ''}`; }).join('; ') || 'none';
  const cl = (S.challenges || []).map(c => c.kind === 'nospend' ? `${c.n}: ${noSpendDays(c).filter(x => x.state === 'free').length} of ${c.target} days` : `${c.n}: ${chDone(c).size} of ${chSteps(c)} done`).join('; ') || 'none';
  const bal = balances(); const wb = S.wallets.map(w => w.n + ' ' + Math.round(bal[w.k] * 100) / 100).join(', ');
  const bud = Object.entries(S.budgets).map(([k,v])=>catOf(k).n+' '+v).join(', ') || 'none';
  const bills = S.bills.map(b=>`${b.name} ${b.amount} due day ${b.day} ${b.paid&&b.paid[now]?'(paid)':'(unpaid)'}`).join('; ') || 'none';
  return `Today: ${today()}\n${sum(prev)}\n${sum(now)}\nWallet balances now: ${wb}. Savings goals: ${gl}. Debts: ${dl}. Lent and borrowed: ${ll}. Challenges: ${cl}. Monthly budgets: ${bud}\nBills this month: ${bills}\nTransactions:\n${tx || '(none)'}`;
}

    toast('Fingerprint or face unlock couldn’t be turned on here. Your PIN still works.');
  }
  render();
}
function lockPanel(){
  const L = getLock();
  if (!L) return `<section class="panel"><h2>🔒 App lock (fingerprint & PIN)</h2><p class="empty" style="margin:0 0 12px">${bioOK ? 'Unlock Tigom with your fingerprint or face whenever it opens on this device. You’ll choose a 4-digit PIN first as a backup.' : 'Lock Tigom with a 4-digit PIN. Fingerprint or face unlock isn’t available in this browser, but you can try turning it on after setting a PIN.'}</p><button class="btn small primary" id="pinOn">${bioOK ? 'Set up fingerprint / face lock' : 'Set up app lock'}</button></section>`;
  const after = L.after !== undefined ? L.after : 60;
  return `<section class="panel"><h2>🔒 App lock (fingerprint & PIN)</h2>
    <div class="settings-row"><span>🔒 PIN lock is on</span><button class="btn small ghost" id="pinOff">Turn off</button></div>
    <div class="settings-row"><span>Change PIN</span><button class="btn small ghost" id="pinChange">Change</button></div>
    ${bioOK ? `<div class="settings-row"><span>Fingerprint / face unlock</span>${switchRow('bioTog', !!L.bio, '')}</div>` : L.bio ? `<div class="settings-row"><span>Fingerprint / face unlock is on</span><button class="btn small ghost" id="bioOff">Turn off</button></div>` : `<div class="settings-row"><span>Fingerprint / face unlock<br><small style="color:var(--muted)">This browser says it’s not available</small></span><button class="btn small ghost" id="bioTry">Try anyway</button></div>`}
    <div class="settings-row"><span>Lock again after leaving</span><select class="in" id="lockAfter" style="width:auto">${[[0, 'Right away'], [60, '1 minute'], [300, '5 minutes'], [900, '15 minutes']].map(([v, t]) => `<option value="${v}" ${after === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <div class="settings-row"><span>Lock Tigom now</span><button class="btn small primary" id="lockNow">Lock</button></div>
  </section>`;
}
function bindLockPanel(){
  const on = $('#pinOn'); if (on) on.onclick = () => showLock('set1');
  const off = $('#pinOff'); if (off) off.onclick = () => showLock('verify', () => { setLock(null); render(); toast('PIN lock is off'); });
  const ch = $('#pinChange'); if (ch) ch.onclick = () => showLock('verify', () => showLock('set1'));
  const bt = $('#bioTog'); if (bt) bt.onchange = e => { if (e.target.checked) enableBio(); else { const L = getLock(); L.bio = null; setLock(L); toast('Fingerprint / face unlock is off'); render(); } };
  const la = $('#lockAfter'); if (la) la.onchange = e => { const L = getLock(); L.after = Number(e.target.value); setLock(L); };
  const bty = $('#bioTry'); if (bty) bty.onclick = async () => { await enableBio(); const L = getLock(); if (L && L.bio) { bioOK = true; render(); } };
  const bof = $('#bioOff'); if (bof) bof.onclick = () => { const L = getLock(); L.bio = null; setLock(L); toast('Fingerprint / face unlock is off'); render(); };
  const ln = $('#lockNow'); if (ln) ln.onclick = () => showLock('unlock');
}
$('#lock').addEventListener('click', e => {
  const d = e.target.closest('[data-d]');
  if (d) return pressDigit(d.dataset.d);
  if (e.target.closest('#padDel')) { pinBuf = pinBuf.slice(0, -1); return paintLock(); }
  const left = e.target.closest('#padLeft');
  if (left) { if (left.dataset.act === 'cancel') { hideLock(); afterOk = null; } else if (left.dataset.act === 'bio') bioUnlock(); return; }
  if (e.target.closest('#lockForgot')) paintLock(col ? 'To remove the PIN, clear this site’s data in your browser settings. Your entries stay safe in your Claude account.' : 'To remove the PIN, clear this site’s data in your browser settings. Entries saved only on this device would be erased too.');
});
document.addEventListener('keydown', e => {
  if ($('#lock').hidden) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressDigit(e.key); }
  else if (e.key === 'Backspace') { pinBuf = pinBuf.slice(0, -1); paintLock(); }
});
document.addEventListener('visibilitychange', () => {
  const L = getLock(); if (!L) return;
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && !lockMode && Date.now() - hiddenAt >= (L.after !== undefined ? L.after : 60) * 1000) showLock('unlock');
});
(async () => {
  try { bioOK = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e) {}
  if (!bioOK && getLock() && getLock().bio) bioOK = true;
  if (lockMode === 'unlock') { paintLock(); const L = getLock(); if (L && L.bio && bioOK) bioUnlock(); }
  if (view === 'more' && !lockMode) render();
})();
if (getLock()) showLock('unlock'); else document.documentElement.classList.remove('locked');

render();
initCloud();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
